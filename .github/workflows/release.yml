# Publishes a release when a version tag (v<version>) is pushed.
#
# The tag must match __version__ in src/openpinch_solvers/__init__.py and
# point at a commit on main. The five platform wheels are built and tested
# by the Wheels workflow, uploaded to PyPI through trusted publishing (no API
# token is stored anywhere) and attached to a GitHub release.
#
# One-time setup on PyPI: add a trusted publisher for the project
# openpinch-solvers with owner waikato-ahuora-smart-energy-systems,
# repository OpenPinch-solvers, workflow release.yml and environment pypi.
# For the first release, add it as a "pending publisher".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        name: Tag matches the package version and is on main
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/openpinch_solvers/__init__.py)"
          test -n "$version" || { echo "::error::No __version__ found."; exit 1; }
          if [ "$tag" != "v$version" ]; then
            echo "::error title=Tag mismatch::Tag $tag does not match package version $version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Not on main::Tag $tag points at a commit that is not on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheels
    needs: plan
    uses: ./.github/workflows/wheels.yml

  pypi:
    name: Publish to PyPI
    needs: [plan, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/openpinch-solvers/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: One wheel per platform, all for this version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -l dist
          test "$(find dist -type f | wc -l)" = 5
          for platform in 'manylinux*_x86_64' 'manylinux*_aarch64' 'macosx_*_arm64' 'macosx_*_x86_64' win_amd64; do
            ls dist/openpinch_solvers-"$VERSION"-py3-none-$platform.whl
          done
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [plan, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "openpinch-solvers $TAG" --generate-notes
          fi
